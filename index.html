<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Info Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="form-panel">
        <h2>CCS Department Enrollment Form</h2>
        <form id="enrollmentForm">
          <div class="field">
            <label for="fullName">Full name</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Jhon Melvy Regidor"
              required
            />
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="jm@example.com"
              required
            />
          </div>

          <div class="field-row">
            <div class="field">
              <label for="age">Age</label>
              <input
                type="number"
                id="age"
                name="age"
                min="0"
                max="120"
                placeholder="19"
                required
              />
            </div>
            <div class="field">
              <label for="phone">Phone number</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="09XX XXX XXXX"
                required
              />
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="birthdate">Birthdate</label>
              <input type="date" id="birthdate" name="birthdate" required />
            </div>
            <div class="field">
              <label for="course">Course</label>
              <select id="course" name="course" required>
                <option value="">Select one</option>
                <option value="BSIT">BSIT</option>
                <option value="BSCS">BSCS</option>
                <option value="BSIS">BSIS</option>
              </select>
            </div>
          </div>

          <fieldset class="field">
            <legend>Gender</legend>
            <div class="radio-group">
              <label
                ><input type="radio" name="gender" value="Female" required />
                Female</label
              >
              <label
                ><input type="radio" name="gender" value="Male" /> Male</label
              >
              <label
                ><input type="radio" name="gender" value="Prefer not to say" />
                Prefer not to say</label
              >
            </div>
          </fieldset>

          <fieldset class="field">
            <legend>Hobbies</legend>
            <div class="checkbox-group">
              <label
                ><input type="checkbox" class="hobby-check" value="Reading" />
                Reading</label
              >
              <label
                ><input type="checkbox" class="hobby-check" value="Gaming" />
                Gaming</label
              >
              <label
                ><input type="checkbox" class="hobby-check" value="Sports" />
                Sports</label
              >
              <label
                ><input type="checkbox" class="hobby-check" value="Music" />
                Music</label
              >
              <label
                ><input type="checkbox" class="hobby-check" value="Coding" />
                Coding</label
              >
            </div>
          </fieldset>

          <div class="field">
            <label for="skillLevel"
              >Self-rated coding skill:
              <span id="skillLevelOut">5</span>/10</label
            >
            <input
              type="range"
              id="skillLevel"
              name="skillLevel"
              min="0"
              max="10"
              value="5"
              required
            />
          </div>

          <div class="field">
            <label for="bio">Short bio</label>
            <textarea
              id="bio"
              name="bio"
              rows="3"
              placeholder="Tell us a bit about yourself..."
              required
            ></textarea>
          </div>

          <div class="actions">
            <button type="submit" id="showInfoBtn" class="btn btn--primary">
              Show My Info
            </button>
            <button type="reset" id="clearBtn" class="btn btn--ghost">
              Clear form
            </button>
          </div>
        </form>
      </section>

      <section class="panel card-panel" aria-labelledby="card-heading">
        <h2 id="card-heading">Your Information</h2>

        <div id="outputCard" class="id-card id-card--empty">
          <div class="id-card__topline">
            <span>CCS DEPARTMENT</span>
          </div>
          <div class="id-card__empty-state">
            <p>No data yet.</p>
            <p class="muted">
              Fill in the form and press "Show My Info" to generate your card.
            </p>
          </div>
        </div>

        <ul id="statusLog" class="status-log"></ul>
      </section>
    </main>

    <script>
      // 1. getElementById()
      const form = document.getElementById("enrollmentForm");

      const fullName = document.getElementById("fullName");
      const email = document.getElementById("email");
      const age = document.getElementById("age");
      const phone = document.getElementById("phone");
      const birthdate = document.getElementById("birthdate");
      const course = document.getElementById("course");
      const skillLevel = document.getElementById("skillLevel");
      const bio = document.getElementById("bio");

      const outputCard = document.getElementById("outputCard");

      const skillLevelOut = document.getElementById("skillLevelOut");
      const clearBtn = document.getElementById("clearBtn");

      // 2. getElementsByClassName()
      const hobbyChecks = document.getElementsByClassName("hobby-check");

      // Update skill level number
      skillLevel.addEventListener("input", function () {
        skillLevelOut.textContent = skillLevel.value;
      });

      // Reset skill level display and card
      clearBtn.addEventListener("click", function () {
        setTimeout(function () {
          skillLevelOut.textContent = skillLevel.value;

          outputCard.classList.add("id-card--empty");

          outputCard.innerHTML = `
      <div class="id-card__topline">
        <span>CCS DEPARTMENT</span>
      </div>

      <div class="id-card__empty-state">
        <p>No data yet.</p>
        <p class="muted">
          Fill in the form and press "Show My Info" to generate your card.
        </p>
      </div>
    `;
        }, 0);
      });

      // Submit form
      form.addEventListener("submit", function (event) {
        // Prevent page reload
        event.preventDefault();

        // 3. querySelector()
        const gender = document.querySelector('input[name="gender"]:checked');

        const genderValue = gender ? gender.value : "Not specified";

        // Get selected hobbies
        let hobbies = [];

        for (let i = 0; i < hobbyChecks.length; i++) {
          if (hobbyChecks[i].checked) {
            hobbies.push(hobbyChecks[i].value);
          }
        }

        // 4. querySelectorAll()
        const fields = document.querySelectorAll(".field");

        const hobbyText = hobbies.length > 0 ? hobbies.join(", ") : "None";

        // Display information on the card
        outputCard.classList.remove("id-card--empty");

        outputCard.innerHTML = `
    <div class="id-card__topline">
      <span>CCS DEPARTMENT</span>
    </div>

    <div class="id-card__content">

      <h3>${fullName.value}</h3>

      <p>
        <strong>Course:</strong>
        ${course.value}
      </p>

      <p>
        <strong>Email:</strong>
        ${email.value}
      </p>

      <p>
        <strong>Age:</strong>
        ${age.value}
      </p>

      <p>
        <strong>Phone:</strong>
        ${phone.value}
      </p>

      <p>
        <strong>Birthdate:</strong>
        ${birthdate.value}
      </p>

      <p>
        <strong>Gender:</strong>
        ${genderValue}
      </p>

      <p>
        <strong>Hobbies:</strong>
        ${hobbyText}
      </p>

      <p>
        <strong>Coding Skill:</strong>
        ${skillLevel.value}/10
      </p>

      <p>
        <strong>Bio:</strong>
        ${bio.value}
      </p>

    </div>
  `;

        // Scroll to View
        outputCard.scrollIntoView({
          behavior: "smooth",
          block: "start",
        });
      });
    </script>
  </body>
</html>
